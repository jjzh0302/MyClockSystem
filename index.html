<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport"
          content="width=device-width, initial-scale=1">

    <title>我的打卡系統</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f3f4f6;
            padding: 20px;
            margin: 0;
            text-align: center;
        }

        .card {
            background: white;
            max-width: 480px;
            margin: 35px auto;
            padding: 25px;
            border-radius: 15px;
            box-shadow: 0 4px 12px #00000015;
        }

        #clock {
            font-size: 32px;
            font-weight: bold;
            margin: 20px 0;
        }

        button {
            padding: 14px 20px;
            margin: 5px;
            border: none;
            border-radius: 10px;
            color: white;
            font-size: 16px;
            cursor: pointer;
        }

        #btnIn {
            background: #16a34a;
        }

        #btnOut {
            background: #2563eb;
        }

        button:disabled {
            background: #9ca3af !important;
            cursor: not-allowed;
        }

        .record {
            margin-top: 25px;
            line-height: 2;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 15px;
            font-size: 14px;
        }

        th, td {
            border-bottom: 1px solid #ddd;
            padding: 10px 4px;
        }

        th {
            background: #f9fafb;
        }

        #btnExport {
            background-color: #334155;
            color: white;
            margin-top: 20px;
            padding: 12px 25px;
            border-radius: 10px;
            font-weight: bold;
        }

            #btnExport:hover {
                background-color: #1e293b;
            }

        .summary {
            background: #eff6ff;
            border-radius: 10px;
            padding: 12px;
            margin: 15px 0;
            line-height: 1.8;
        }

        .table-wrap {
            overflow-x: auto;
        }

            .table-wrap table {
                min-width: 690px;
            }

        .small-note {
            font-size: 12px;
            color: #64748b;
        }

        #btnClear {
            background-color: #dc2626;
            color: white;
            margin-top: 10px;
            padding: 12px 25px;
            border: none;
            border-radius: 10px;
            font-weight: bold;
            cursor: pointer;
        }

            #btnClear:hover {
                background-color: #b91c1c;
            }
    </style>
</head>

<body>
    <div class="card">
        <h2>我的打卡系統</h2>

        <p id="today"></p>
        <div id="clock"></div>

        <button id="btnIn" onclick="clockIn()">
            上班打卡
        </button>

        <button id="btnOut" onclick="clockOut()">
            下班打卡
        </button>

        <div class="record">
            <h3>今日紀錄</h3>
            <div id="inTime">上班：尚未打卡</div>
            <div id="outTime">下班：尚未打卡</div>
            <div id="todayHours">今日工時：尚未完成打卡</div>
            <div id="todayPayable" class="small-note"></div>
        </div>

        <div class="summary">
            <h3 id="monthTitle">本月工時統計</h3>
            <div id="monthDays">完成天數：0 天</div>
            <div id="monthActual">實際工時：0 小時 0 分</div>
            <div id="monthRounded">計算工時：0 小時</div>
            
        </div>

        <h3>歷史紀錄</h3>

        <div class="table-wrap">
            <table>
                <thead>
                    <tr>
                        <th>日期</th>
                        <th>上班</th>
                        <th>下班</th>
                        <th>實際工時</th>
                        <th>計薪起點</th>
                        <th>計薪終點</th>
                        <th>計算工時</th>
                    </tr>
                </thead>
                <tbody id="recordTable"></tbody>
            </table>
        </div>
        <button id="btnExport" onclick="exportCSV()">
            匯出打卡紀錄
        </button>
        <button id="btnClear" onclick="clearRecords()">清除打卡紀錄</button>
    </div>

    <script>
        const storageKey = "myClockRecords";

        function getDateKey(date) {
            const year = date.getFullYear();
            const month = String(date.getMonth() + 1)
                .padStart(2, "0");
            const day = String(date.getDate())
                .padStart(2, "0");

            return `${year}-${month}-${day}`;
        }

        function getTime(date) {
            return date.toLocaleTimeString("zh-TW", {
                hour12: false
            });
        }

        function getRecords() {
            return JSON.parse(
                localStorage.getItem(storageKey) || "{}"
            );
        }

        function saveRecords(records) {
            localStorage.setItem(
                storageKey,
                JSON.stringify(records)
            );
        }

        function updateClock() {
            const now = new Date();

            document.getElementById("today")
                .textContent =
                now.toLocaleDateString("zh-TW");

            document.getElementById("clock")
                .textContent = getTime(now);
        }

        function clockIn() {
            const now = new Date();
            const key = getDateKey(now);
            const records = getRecords();

            if (records[key]?.clockIn) {
                alert("今天已經上班打卡過了！");
                return;
            }

            records[key] = {
                clockIn: getTime(now),
                clockOut: ""
            };

            saveRecords(records);
            renderRecords();
        }

        function clockOut() {
            const now = new Date();
            const key = getDateKey(now);
            const records = getRecords();

            if (!records[key]?.clockIn) {
                alert("請先進行上班打卡！");
                return;
            }

            if (records[key].clockOut) {
                alert("今天已經下班打卡過了！");
                return;
            }

            records[key].clockOut = getTime(now);

            saveRecords(records);
            renderRecords();
        }

        // 只依上下班原始時間計算，不修改舊紀錄的儲存格式。
        function getWorkResult(record) {
            if (!record?.clockIn || !record?.clockOut) return null;
            return calculateWorkHours(record.clockIn, record.clockOut);
        }

        function formatMinutes(totalMinutes) {
            return `${Math.floor(totalMinutes / 60)} 小時 ${totalMinutes % 60} 分`;
        }

        function renderRecords() {
            const records = getRecords();
            const today = getDateKey(new Date());

            const todayRecord = records[today] || {};

            document.getElementById("inTime")
                .textContent = "上班：" +
                (todayRecord.clockIn || "尚未打卡");

            document.getElementById("outTime")
                .textContent = "下班：" +
                (todayRecord.clockOut || "尚未打卡");

            const todayWork = getWorkResult(todayRecord);
            document.getElementById("todayPayable").textContent = todayWork
                ? `計薪時間：${todayWork.payStart} ～ ${todayWork.payEnd}`
                : "";
            document.getElementById("todayHours").textContent = todayWork
                ? `今日工時：實際 ${formatMinutes(todayWork.actualMinutes)} ／ 計算 ${todayWork.roundedHours} 小時`
                : "今日工時：尚未完成打卡";

            document.getElementById("btnIn")
                .disabled = !!todayRecord.clockIn;

            document.getElementById("btnOut")
                .disabled =
                !todayRecord.clockIn ||
                !!todayRecord.clockOut;

            const table = document.getElementById(
                "recordTable"
            );

            table.innerHTML = "";

            const dates = Object.keys(records).sort().reverse();
            const month = today.slice(0, 7);
            let completedDays = 0;
            let monthlyMinutes = 0;
            let monthlyRoundedHours = 0;

            for (const date of dates) {
                const record = records[date];

                const row = document.createElement("tr");
                const work = getWorkResult(record);

                if (work && date.startsWith(month + "-")) {
                    completedDays++;
                    monthlyMinutes += work.actualMinutes;
                    monthlyRoundedHours += work.roundedHours;
                }

                for (const value of [
                    date,
                    record.clockIn || "-",
                    record.clockOut || "-",
                    work ? formatMinutes(work.actualMinutes) : "-",
                    work ? work.payStart : "-",
                    work ? work.payEnd : "-",
                    work ? `${work.roundedHours} 小時` : "-"
                ]) {
                    const cell = document.createElement("td");
                    cell.textContent = value;
                    row.appendChild(cell);
                }

                table.appendChild(row);
            }

            document.getElementById("monthTitle").textContent = `${month} 工時統計`;
            document.getElementById("monthDays").textContent = `完成天數：${completedDays} 天`;
            document.getElementById("monthActual").textContent = `實際工時：${formatMinutes(monthlyMinutes)}`;
            document.getElementById("monthRounded").textContent = `計算工時：${monthlyRoundedHours} 小時`;
        }

        updateClock();
        document.getElementById("today").dataset.date = getDateKey(new Date());
        renderRecords();

        setInterval(() => {
            const previousDate =
                document.getElementById("today").dataset.date;

            const currentDate = getDateKey(new Date());

            updateClock();

            if (previousDate !== currentDate) {
                document.getElementById("today")
                    .dataset.date = currentDate;
                renderRecords();
            }
        }, 1000);

        function exportCSV() {
            const records = getRecords();
            const dates = Object.keys(records).sort();

            if (dates.length === 0) {
                alert("目前沒有打卡紀錄！");
                return;
            }

            const rows = [
                ["日期", "上班時間", "下班時間", "實際工時(分鐘)", "計薪起點", "計薪終點", "計算工時(小時)"]
            ];

            for (const date of dates) {
                const record = records[date];

                const work = getWorkResult(record);
                rows.push([
                    date,
                    record.clockIn || "",
                    record.clockOut || "",
                    work ? work.actualMinutes : "",
                    work ? work.payStart : "",
                    work ? work.payEnd : "",
                    work ? work.roundedHours : ""
                ]);
            }

            const csv = rows
                .map(row => row.join(","))
                .join("\r\n");

            const blob = new Blob(
                ["\uFEFF" + csv],
                { type: "text/csv;charset=utf-8;" }
            );

            const url = URL.createObjectURL(blob);
            const link = document.createElement("a");

            link.href = url;
            link.download = "打卡紀錄.csv";

            document.body.appendChild(link);
            link.click();
            document.body.removeChild(link);

            URL.revokeObjectURL(url);
        }

        function clearRecords() {

            const records = getRecords();

            // 判斷有沒有打卡紀錄
            if (Object.keys(records).length === 0) {
                alert("目前沒有打卡紀錄可以清除！");
                return;
            }

            // 第一次確認
            const confirmFirst = confirm(
                "確定要清除所有打卡紀錄嗎？\n\n請先確認已經匯出 CSV 備份。"
            );

            if (!confirmFirst) {
                return;
            }

            // 第二次確認
            const confirmSecond = confirm(
                "最後確認！\n\n清除後無法從本系統復原，確定要繼續嗎？"
            );

            if (!confirmSecond) {
                return;
            }

            // 清除儲存的打卡紀錄
            localStorage.removeItem(storageKey);

            // 重新顯示畫面
            renderRecords();

            alert("打卡紀錄已成功清除！");
        }


        // 計薪規則：只換算工時，打卡原始時間仍然保留。
        function calculateWorkHours(startTime, endTime) {
            function toSeconds(time) {
                const parts = time.split(":").map(Number);
                return parts[0] * 3600 + parts[1] * 60 + (parts[2] || 0);
            }

            function formatPayTime(seconds) {
                const dayOffset = Math.floor(seconds / 86400);
                const minuteOfDay = Math.floor((seconds % 86400) / 60);
                const hh = String(Math.floor(minuteOfDay / 60)).padStart(2, "0");
                const mm = String(minuteOfDay % 60).padStart(2, "0");
                return `${hh}:${mm}` + (dayOffset ? `（隔日+${dayOffset}）` : "");
            }

            const start = toSeconds(startTime);
            let end = toSeconds(endTime);
            if (end < start) end += 86400; // 原有的跨午夜處理

            // 每半小時是一個區間，上班時間允許前 10 分鐘緩衝。
            // 例：05:10:00 → 05:00；05:10:01 → 05:30。
            const period = 30 * 60;
            const base = Math.floor(start / period) * period;
            const payStartSeconds = start - base <= 10 * 60 ? base : base + period;

            // 下班時間依鐘面 20／50 分進位到整點或半點。
            // 例：08:19 → 08:00；08:20 → 08:30；08:50 → 09:00。
            const hourStart = Math.floor(end / 3600) * 3600;
            const secondsIntoHour = end - hourStart;
            let payEndSeconds;
            if (secondsIntoHour >= 50 * 60) {
                payEndSeconds = hourStart + 3600;
            } else if (secondsIntoHour >= 20 * 60) {
                payEndSeconds = hourStart + 1800;
            } else {
                payEndSeconds = hourStart;
            }

            // 短時數班次可能進位後產生負值，計薪工時最低為 0。
            const payableMinutes = Math.max(0, (payEndSeconds - payStartSeconds) / 60);
            const actualMinutes = Math.floor((end - start) / 60);

            return {
                actualMinutes: actualMinutes,
                roundedHours: payableMinutes / 60,
                payStart: formatPayTime(payStartSeconds),
                payEnd: formatPayTime(payEndSeconds)
            };
        }

    </script>
</body>
</html>
